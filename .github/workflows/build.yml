name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  esp32s3-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Nix
        uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            max-jobs = 2
            cores = 2
      - name: Run offline board-workflow safety tests
        run: python3 -m unittest discover -s tests -v
      - name: Check flake and cross-build smoke firmware
        run: nix flake check --print-build-logs --max-jobs 2 --cores 2
